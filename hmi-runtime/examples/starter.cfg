# Prometheus HMI - site configuration (hmi.cfg next to industrial_hmi.exe).
# One option per line; # starts a comment. Command-line options are added after these.
#
# First steps on a new panel:
#   1. Set the role PINs (asked twice, never on the command line):
#        industrial_hmi --set-pin operator
#        industrial_hmi --set-pin maintenance
#        industrial_hmi --set-pin engineer
#   2. Tell the HMI where the devices are (below), then start it.
#
# Until site PINs are set, only the Viewer role can sign in: nothing can be operated.

# Scan the PLC network. Only devices that identify as a known PLC or drive are attached.
#--scan 192.168.1.0/24:502

# Devices the scan cannot identify, or that are not PLCs, with their driver module:
#--plc 192.168.1.30/u1@altivar
#--plc 192.168.1.50/u1@em6400

# Attach at most this many devices (the build holds up to 128).
#--max-devices 32

# More examples: examples\lab-site.cfg (a real site) and examples\bench.cfg (test devices on this PC).
