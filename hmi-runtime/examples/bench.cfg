# Bench configuration: the PLC simulator on this PC (plc_simulator.exe, ports 1502-1509)
#   plc_simulator.exe --add atv340 --add tank --add meter
#
# Usage:  industrial_hmi.exe --config examples\bench.cfg
# Copy this file to hmi.cfg next to industrial_hmi.exe to make it the default.

--scan 127.0.0.1:1502-1509          # PLCs and drives are found on their own (FC43 identity)
--plc  127.0.0.1:1504@em6400        # the energy meter is not a PLC: list it explicitly
