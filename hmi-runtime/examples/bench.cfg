# Bench configuration: Modbus TCP test devices on this PC (ports 1502-1629)
#
# Usage:  industrial_hmi.exe --config examples\bench.cfg
# Copy this file to hmi.cfg next to industrial_hmi.exe to make it the default.

--scan 127.0.0.1:1502-1629          # PLCs and drives are found on their own (FC43 identity)
--plc  127.0.0.1:1504@em6400        # the energy meter is not a PLC: list it explicitly

# BENCH ONLY: let the roles sign in with the factory PINs 1111 / 2222 / 3333. Never put this in a
# site hmi.cfg: on a real plant set every role's PIN with  industrial_hmi --set-pin <role>
--allow-factory-pins
