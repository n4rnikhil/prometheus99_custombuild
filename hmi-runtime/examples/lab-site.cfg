# Site configuration template for a real network (copy to hmi.cfg next to industrial_hmi.exe).
# Replace the addresses with your devices. One option per line; # starts a comment.

# Scan the PLC network. Only devices that identify as a known PLC or drive are attached.
--scan 192.168.1.0/24:502

# Devices the scan cannot identify, or that are not PLCs: list them with their module.
# <ip>/u<unit id>@<module>.  Modules: altivar, em6400, generic (and the application modules
# tank, conveyor, boiler, pumps, compressor, ahu, abb - these attach only when the PLC runs the
# matching program, so they are normally not needed here).
--plc 192.168.1.30/u1@altivar       # Altivar drive on the Ethernet port
--plc 192.168.1.50/u1@em6400        # EM6400NG meter behind the PAS600 gateway (unit id = meter address)

# Keep devices that go offline on the dashboard (0 = never remove them).
--remove-after-ms 0
