name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf qemu-user
      - name: PLC simulator - build and model tests
        working-directory: plc-simulator
        run: make && make test
      - name: HMI runtime - build and every test suite (ASan + UBSan)
        working-directory: hmi-runtime
        run: make test
      - name: Raspberry Pi targets - cross-compile, then run the tests under qemu
        working-directory: hmi-runtime
        run: |
          for t in aarch64-linux-gnu arm-linux-gnueabihf; do
            make clean
            make CC=$t-gcc industrial_hmi
            make CC=$t-gcc SAN= tests/test_core tests/test_integration tests/test_modbus_faults
            q=qemu-${t%%-*}
            for x in test_core test_integration test_modbus_faults; do $q -L /usr/$t ./tests/$x; done
          done
      - name: Static analysis
        run: |
          cppcheck --std=c99 --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr -q -I hmi-runtime/include hmi-runtime/src hmi-runtime/include
          cppcheck --std=c99 --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr -q -I plc-simulator/include plc-simulator/src

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: PLC simulator
        shell: cmd
        working-directory: plc-simulator
        run: build.bat test
      - name: HMI runtime
        shell: cmd
        working-directory: hmi-runtime
        run: build.bat test
