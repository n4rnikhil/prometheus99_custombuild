name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf qemu-user libx11-dev python3-pil gcc-mingw-w64-x86-64 nsis
      - name: PLC simulator - build and model tests
        working-directory: plc-simulator
        run: make && make test
      - name: HMI runtime - build and every test suite (ASan + UBSan)
        working-directory: hmi-runtime
        run: make test
      - name: Raspberry Pi targets - cross-compile, then run the tests under qemu
        working-directory: hmi-runtime
        run: |
          for t in aarch64-linux-gnu arm-linux-gnueabihf; do
            make clean
            make CC=$t-gcc industrial_hmi
            make CC=$t-gcc SAN= tests/test_core tests/test_integration tests/test_modbus_faults
            q=qemu-${t%%-*}
            for x in test_core test_integration test_modbus_faults; do $q -L /usr/$t ./tests/$x; done
          done
      - name: Release files - Linux archives and the Windows installer
        run: |
          installer/build_linux_release.sh dist
          installer/build_windows_release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/Prometheus-HMI-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Static analysis
        run: |
          cppcheck --std=c99 --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr -q -I hmi-runtime/include hmi-runtime/src hmi-runtime/include
          cppcheck --std=c99 --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr -q -I plc-simulator/include plc-simulator/src

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: PLC simulator
        shell: cmd
        working-directory: plc-simulator
        run: build.bat test
      - name: HMI runtime
        shell: cmd
        working-directory: hmi-runtime
        run: build.bat test
      - name: Checksums for the release artefacts
        shell: pwsh
        run: |
          $files = @("hmi-runtime/industrial_hmi.exe", "plc-simulator/plc_simulator.exe", "plc-simulator/plc_simulator_cli.exe")
          Get-FileHash -Algorithm SHA256 $files | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            hmi-runtime/industrial_hmi.exe
            plc-simulator/plc_simulator.exe
            plc-simulator/plc_simulator_cli.exe
            SHA256SUMS.txt
